<script>
// ============================================================
// 集點寶貝 · Reward Stars App
// ============================================================

const STORAGE_KEY = 'jdbb_data_v1';
const LIBRARY_KEY = 'jdbb_library_v1';
const MANIFEST_URL = 'assets/manifest.json';

// In-memory library: bundled (from manifest) + custom (from localStorage)
// Both store entries as { id, src, label?, source: 'bundled'|'custom' }
let bundledLib = { stickers:[], avatars:[], trophies:[], illustrations:{} };
let customLib = { stickers:[], avatars:[], trophies:[], illustrations:{} };

const STICKERS = [
  '⭐','❤️','🌟','✨','🌈','🎈','🎀','🌸',
  '🍓','🦋','🐱','🐶','🐰','🦄','🐻','🐼',
  '🎁','🍩','🍭','🧁','🍪','🌻','🌺','🍀',
  '⚽','🏀','🚗','✈️','🚀','🎵','🎨','📚'
];

// Sticker category maps for the picker tabs
const STICKER_CATS_MAP = {
  star:   new Set(['⭐','❤️','🌟','✨','🌈','🎀','🌸','🍀','🌺','🌻','💫','💕','💖','🎊','🎉','🎈']),
  animal: new Set(['🦋','🐱','🐶','🐰','🦄','🐻','🐼','🐨','🦊','🐯','🐮','🐷','🐸','🐧','🐤','🦁','🐵']),
  food:   new Set(['🍓','🍩','🍭','🧁','🍪','🍰','🍦','🎂','🍎','🍊','🍇','🍉']),
  sport:  new Set(['⚽','🏀','🚗','✈️','🚀','🎵','🎨','📚','🎮','🛼','🏆','🎪','🎠']),
  party:  new Set(['🎈','🎁','🎊','🎉','🎆','🎇','🧨','🪄','🎀','🎂']),
};

// Sticker category tabs disabled per user request — keep function as no-op
// so existing call sites still work without errors.
function upgradeStickerGrid(gridId) {
  return; // no categories anymore
  // legacy code below kept only for reference, never runs
  const grid = document.getElementById(gridId);
  if (!grid || grid.parentNode.classList.contains('sticker-picker-wrap')) return;

  const items = grid.querySelectorAll('.sticker-opt');
  const hasImages = [...items].some(it => it.querySelector('img'));

  const catDefs = [
    { id: 'all',    icon: '🌟', label: '全部',  keys: null },
    { id: 'star',   icon: '⭐', label: '閃亮',  keys: STICKER_CATS_MAP.star },
    { id: 'animal', icon: '🐱', label: '動物',  keys: STICKER_CATS_MAP.animal },
    { id: 'food',   icon: '🍩', label: '美食',  keys: STICKER_CATS_MAP.food },
    { id: 'sport',  icon: '⚽', label: '活動',  keys: STICKER_CATS_MAP.sport },
    { id: 'party',  icon: '🎉', label: '節慶',  keys: STICKER_CATS_MAP.party },
  ];
  if (hasImages) catDefs.push({ id: 'image', icon: '🖼️', label: '圖庫', keys: 'image' });

  const wrap = document.createElement('div');
  wrap.className = 'sticker-picker-wrap';

  const tabs = document.createElement('div');
  tabs.className = 'sticker-tabs';

  catDefs.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sticker-tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = cat.icon;
    btn.title = cat.label;
    btn.onclick = () => {
      tabs.querySelectorAll('.sticker-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      items.forEach(item => {
        if (cat.keys === null) {
          item.style.display = '';
        } else if (cat.keys === 'image') {
          item.style.display = item.querySelector('img') ? '' : 'none';
        } else {
          item.style.display = cat.keys.has(item.dataset.v) ? '' : 'none';
        }
      });
    };
    tabs.appendChild(btn);
  });

  grid.parentNode.insertBefore(wrap, grid);
  wrap.appendChild(tabs);
  wrap.appendChild(grid);
}

const AVATARS = [
  '🐻','🐱','🐶','🐰','🦊','🐼','🐨','🦁',
  '🐯','🐮','🐷','🐸','🐵','🦄','🐧','🐤'
];

const COLORS = [
  { name:'pink', main:'#FF8FA3', soft:'#FFE4E9' },
  { name:'mint', main:'#5DBFA3', soft:'#DCF3EB' },
  { name:'sun', main:'#F5B748', soft:'#FFF1CC' },
  { name:'sky', main:'#6FA8DC', soft:'#E2EFFB' },
  { name:'lilac', main:'#A88BD9', soft:'#EEE5FA' },
  { name:'coral', main:'#FF7F66', soft:'#FFE2D9' },
];

// ---- State ----
let state = loadState();
let view = { tab: 'cards', kidId: null, openMenuId: null };

function loadState() {
  let data = { kids: [], themes: [], history: [], schemaVersion: 3 };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch(e) { console.warn('load failed', e); }
  // Migration: ensure each theme has a stamps array
  (data.themes || []).forEach(t => {
    if (!Array.isArray(t.stamps)) {
      const count = Math.max(0, t.points || 0);
      const baseAt = t.createdAt || Date.now();
      t.stamps = Array.from({length: count}, (_, i) => ({
        id: uid('s'),
        at: baseAt + i * 60000,
        sticker: t.sticker || '⭐',
      }));
    }
    // Always derive points
    t.points = t.stamps.length;
  });
  // Migration v2 → v3: strip huge base64 photos from history events.
  // Photos are now looked up from theme.stamps[i] via stampId at render time.
  let migrated = false;
  if ((data.schemaVersion || 0) < 3) {
    let saved = 0;
    (data.history || []).forEach(h => {
      if (h.photo) { saved += h.photo.length; delete h.photo; migrated = true; }
      if (h.trophyPhoto) { saved += h.trophyPhoto.length; delete h.trophyPhoto; migrated = true; }
      // Also strip huge reason if somehow >2KB (unlikely but safe)
      if (h.reason && h.reason.length > 2048) { delete h.reason; migrated = true; }
    });
    if (saved > 0) console.info('[migration] stripped', Math.round(saved/1024), 'KB of duplicated photo data from history');
    migrated = true;
  }
  // Also cap history to 500 entries (was 2000) — long history isn't super useful
  if (Array.isArray(data.history) && data.history.length > 500) {
    data.history.length = 500;
    migrated = true;
  }
  data.schemaVersion = 3;
  // Persist migrated data immediately so it doesn't have to re-run every load
  if (migrated) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  }
  return data;
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ---- Library (圖庫) state + helpers ----
function loadCustomLib() {
  try {
    const raw = localStorage.getItem(LIBRARY_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      customLib.stickers = Array.isArray(data.stickers) ? data.stickers : [];
      customLib.avatars = Array.isArray(data.avatars) ? data.avatars : [];
      customLib.trophies = Array.isArray(data.trophies) ? data.trophies : [];
      customLib.illustrations = (data.illustrations && typeof data.illustrations === 'object') ? data.illustrations : {};
    }
  } catch(e) { console.warn('load library failed', e); }
}
function saveCustomLib() {
  try {
    localStorage.setItem(LIBRARY_KEY, JSON.stringify(customLib));
  } catch(e) {
    toast('圖庫空間已滿，請刪除一些圖檔');
    console.warn(e);
  }
}

// Load bundled manifest — first try inline data, then fetch assets/manifest.json
async function loadManifest() {
  // Compute base path for the manifest (everything before /manifest.json)
  // e.g. 'assets/manifest.json' → 'assets/'
  const manifestBase = MANIFEST_URL.replace(/manifest\.json.*$/, '');

  // Resolve a path inside the manifest: prepend manifestBase unless it's already absolute
  function resolvePath(p, base) {
    if (!p || typeof p !== 'string') return p;
    if (p.startsWith('data:') || p.startsWith('http://') || p.startsWith('https://') || p.startsWith('/')) return p;
    if (p.startsWith(base)) return p; // already prefixed
    return base + p;
  }

  const norm = (arr, base) => Array.isArray(arr)
    ? arr.map((item, i) => {
        if (typeof item === 'string') return { id: 'b_' + i + '_' + item.replace(/[^a-z0-9]/gi,''), src: resolvePath(item, base), source: 'bundled' };
        return { id: 'b_' + (item.id || i), src: resolvePath(item.src, base), label: item.label, source: 'bundled' };
      }).filter(x => x.src)
    : [];

  function normIllustrations(illust, base) {
    const out = {};
    if (illust && typeof illust === 'object') {
      for (const [k, v] of Object.entries(illust)) {
        out[k] = resolvePath(v, base);
      }
    }
    return out;
  }

  // Inline data (when images are embedded in the HTML itself)
  // Inline images already have absolute data: URLs, so base is empty.
  if (window.__BUNDLED_MANIFEST__) {
    const data = window.__BUNDLED_MANIFEST__;
    bundledLib.stickers = norm(data.stickers, '');
    bundledLib.avatars = norm(data.avatars, '');
    bundledLib.trophies = norm(data.trophies, '');
    bundledLib.illustrations = normIllustrations(data.illustrations, '');
    return true;
  }

  // Otherwise fetch from assets/manifest.json — prefix paths with assets/
  try {
    const res = await fetch(MANIFEST_URL, { cache: 'no-store' });
    if (!res.ok) return false;
    const data = await res.json();
    bundledLib.stickers = norm(data.stickers, manifestBase);
    bundledLib.avatars = norm(data.avatars, manifestBase);
    bundledLib.trophies = norm(data.trophies, manifestBase);
    bundledLib.illustrations = normIllustrations(data.illustrations, manifestBase);
    return true;
  } catch(e) {
    console.info('No bundled manifest found (this is OK):', e.message);
    return false;
  }
}

// Resolve sticker value (emoji | "lib:id" | direct data/asset/url) to display info
function resolveSticker(value) {
  if (!value) return { type: 'emoji', value: '⭐' };
  if (typeof value === 'string') {
    // Direct image URL (data URL, http(s), asset path)
    if (value.startsWith('data:image') || value.startsWith('http://') || value.startsWith('https://') || value.startsWith('assets/')) {
      return { type: 'image', src: value };
    }
    // Library reference
    if (value.startsWith('lib:')) {
      const id = value.slice(4);
      for (const cat of ['stickers','avatars','trophies']) {
        const found = (customLib[cat].concat(bundledLib[cat])).find(it => it.id === id);
        if (found) return { type: 'image', src: found.src, label: found.label };
      }
      return { type: 'emoji', value: '❓' }; // fallback if deleted
    }
  }
  return { type: 'emoji', value };
}

// Render sticker HTML — handles emoji and image uniformly
function renderStickerHTML(value, opts) {
  opts = opts || {};
  const r = resolveSticker(value);
  if (r.type === 'image') {
    const size = opts.size || '100%';
    const radius = opts.round ? '50%' : (opts.radius || '0');
    const sizeStr = typeof size === 'number' ? size + 'px' : size;
    return `<img src="${escapeAttr(r.src)}" alt="${escapeAttr(r.label||'')}" style="width:${sizeStr};height:${sizeStr};object-fit:contain;border-radius:${radius};display:inline-block;vertical-align:middle;">`;
  }
  return escapeHtml(r.value);
}

// For inline use in template strings (alias)
function S(value, opts) { return renderStickerHTML(value, opts); }

// Combine library + emoji defaults for a picker
function getAllForCategory(cat, emojiDefaults) {
  // bundled first, then emoji defaults, then custom uploads
  const bundled = (bundledLib[cat] || []).map(it => ({ value: 'lib:' + it.id, type: 'image', src: it.src, source: 'bundled' }));
  const custom = (customLib[cat] || []).map(it => ({ value: 'lib:' + it.id, type: 'image', src: it.src, source: 'custom' }));
  // 有圖片貼紙時就不顯示預設 emoji
  const emojis = (bundled.length + custom.length) ? [] : emojiDefaults.map(e => ({ value: e, type: 'emoji', source: 'default' }));
  return bundled.concat(emojis).concat(custom);
}

function getIllustration(key) {
  if (customLib.illustrations && customLib.illustrations[key]) return customLib.illustrations[key];
  if (bundledLib.illustrations && bundledLib.illustrations[key]) return bundledLib.illustrations[key];
  return null;
}

function escapeAttr(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function uid(prefix='id') {
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,6);
}

function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

function addDaysISO(iso, days) {
  const d = new Date(iso);
  d.setDate(d.getDate() + days);
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function daysBetween(a, b) {
  const ms = new Date(b) - new Date(a);
  return Math.round(ms / 86400000);
}

function logEvent(type, payload) {
  state.history.unshift({
    id: uid('h'),
    timestamp: Date.now(),
    type,
    ...payload
  });
  // Cap history at 2000 entries
  if (state.history.length > 500) state.history.length = 500;
}

// ---- Toast ----
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ---- Modal ----
function openModal(html) {
  const overlay = document.getElementById('modal');
  document.getElementById('modalContent').innerHTML = html;
  overlay.classList.add('show');
  overlay.onclick = e => { if (e.target === overlay) closeModal(); };
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

// ---- Confetti ----
function burstConfetti() {
  const c = document.getElementById('confetti');
  c.style.display = 'block';
  c.innerHTML = '';
  const palette = ['#FF8FA3','#FFD66B','#8DD9C0','#9BC9F2','#C7B0E6','#FF7F66'];
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('div');

// ---- Stamp celebration animations ----
const ANIMATIONS = ['hearts', 'sparkles', 'character', 'rainbow', 'fireworks'];

function playStampAnimation(sticker, theme) {
  const overlay = document.getElementById('stampAnim');
  overlay.innerHTML = '';
  overlay.classList.add('show');
  const which = ANIMATIONS[Math.floor(Math.random() * ANIMATIONS.length)];

  if (which === 'hearts') {
    animHearts(overlay, sticker);
  } else if (which === 'sparkles') {
    animSparkles(overlay, sticker);
  } else if (which === 'character') {
    animCharacter(overlay, sticker);
  } else if (which === 'rainbow') {
    animRainbow(overlay, sticker);
  } else {
    animFireworks(overlay, sticker);
  }

  // Click anywhere to dismiss early
  overlay.onclick = () => {
    overlay.classList.remove('show');
    overlay.innerHTML = '';
  };

  const timer = setTimeout(() => {
    overlay.classList.remove('show');
    overlay.innerHTML = '';
  }, 2400);

  // Cancel auto-dismiss if user clicked
  overlay.addEventListener('click', () => clearTimeout(timer), { once: true });
}

function makeCenterSticker(sticker) {
  const wrap = document.createElement('div');
  wrap.className = 'stamp-anim-center';
  const big = document.createElement('div');
  big.className = 'stamp-anim-sticker';
  // Resolve sticker — handle both emoji and image (lib:xxx) values
  const resolved = resolveSticker(sticker);
  if (resolved.type === 'image') {
    big.innerHTML = `<img src="${escapeAttr(resolved.src)}" alt="" style="width:140px; height:140px; object-fit:contain;">`;
  } else {
    big.textContent = resolved.value;
  }
  wrap.appendChild(big);
  return wrap;
}

function renderKidStrip() {
  const strip = document.getElementById('kidStrip');
  if (state.kids.length === 0) {
    strip.innerHTML = '';
    return;
  }
  if (!view.kidId || !state.kids.find(k => k.id === view.kidId)) {
    view.kidId = state.kids[0].id;
  }
  strip.innerHTML = state.kids.map(k => {
    const color = COLORS.find(c => c.name === k.color) || COLORS[0];
    return `
      <div class="kid-chip ${view.kidId === k.id ? 'active' : ''}" data-kid="${k.id}">
        <div class="kid-avatar" style="background:${color.soft}">${renderStickerHTML(k.avatar, {size:'85%', round:true})}</div>
        <span class="kid-name">${escapeHtml(k.name)}</span>
        ${view.kidId === k.id ? `<span class="kid-edit" aria-label="編輯 ${escapeAttr(k.name)}"><svg viewBox="0 0 24 24"><path d="M5,19 L6.2,14.6 L15.6,5.2 L18.8,8.4 L9.4,17.8Z" fill="#FBC444"/><path d="M15.6,5.2 L17,3.8 C17.8,3 19,3 19.8,3.8 L20.2,4.2 C21,5 21,6.2 20.2,7 L18.8,8.4Z" fill="#F26FAE"/><path d="M5,19 L6.2,14.6 L9.4,17.8Z" fill="#2B2622"/></svg></span>` : ''}
      </div>
    `;
  }).join('') + `
    <div class="kid-chip add" id="addKidChip">
      <span>＋ 新增小朋友</span>
    </div>
  `;
  strip.querySelectorAll('.kid-chip[data-kid]').forEach(el => {
    el.onclick = () => {
      if (kidLongPressed) { kidLongPressed = false; return; }
      // tapping the kid who is already selected opens the editor (name, avatar, colour)
      if (view.kidId === el.dataset.kid) { openKidEditor(el.dataset.kid); return; }
      view.kidId = el.dataset.kid; render();
    };
  });
  document.getElementById('addKidChip').onclick = () => openKidEditor(null);
}

function renderCards() {
  const content = document.getElementById('content');

  if (state.kids.length === 0) {
    content.innerHTML = renderWelcome();
    document.getElementById('startBtn').onclick = () => openKidEditor(null);
    return;
  }

  const kid = state.kids.find(k => k.id === view.kidId);
  if (!kid) { content.innerHTML = ''; return; }

  const themes = state.themes.filter(t => t.kidId === kid.id)
    .sort((a, b) => {
      // active first, then completed, then expired
      const order = { active: 0, completed: 1, expired: 2 };
      const sa = themeStatus(a), sb = themeStatus(b);
      if (sa !== sb) return order[sa] - order[sb];
      return b.createdAt - a.createdAt;
    });

  if (themes.length === 0) {
    content.innerHTML = renderEmptyThemes(kid);
    document.getElementById('newThemeBtn').onclick = () => openThemeEditor(null);
    return;
  }

  content.innerHTML = `
    <div class="themes-list">
      ${themes.map(renderThemeCard).join('')}
    </div>
  `;

  // Bind events on rendered cards
  content.querySelectorAll('.stamp-cell').forEach(cell => {
    const tid = cell.dataset.theme;
    const idx = parseInt(cell.dataset.idx, 10);
    if (cell.classList.contains('filled')) {
      cell.onclick = () => openStampDetail(tid, idx);
    } else {
      cell.onclick = () => stamp(tid);
    }
  });
  content.querySelectorAll('[data-action]').forEach(btn => {
    const tid = btn.dataset.theme;
    const action = btn.dataset.action;
    btn.onclick = (e) => {
      e.stopPropagation();
      if (action === 'menu') toggleMenu(tid);
      if (action === 'edit') { closeAllMenus(); openThemeEditor(tid); }
      if (action === 'delete') { closeAllMenus(); confirmDeleteTheme(tid); }
      if (action === 'redeem') redeemTheme(tid);
      if (action === 'stamp') stampFirstEmpty(tid);
      if (action === 'reset') confirmResetTheme(tid);
      if (action === 'open-trophy') openTrophyDetail(tid);
    };
  });
  document.addEventListener('click', closeAllMenus);
}

function themeStatus(t) {
  if (t.points >= t.goal) return t.redeemedAt ? 'completed' : 'completed-pending';
  if (t.endDate && t.endDate < todayISO()) return 'expired';
  return 'active';
}

function renderThemeCard(t) {
  const color = COLORS.find(c => c.name === t.color) || COLORS[0];
  const status = themeStatus(t);
  const cells = [];
  for (let i = 0; i < t.goal; i++) {
    const s = t.stamps[i];
    if (s) {
      const sticker = s.sticker || t.sticker || '⭐';
      const hasPhoto = !!s.photo;
      const hasNote = !!s.reason;
      cells.push(`
        <div class="stamp-cell filled ${hasPhoto ? 'has-photo' : ''}"
             data-theme="${t.id}" data-idx="${i}"
             ${hasPhoto ? `style="background-image:url('${s.photo}')"` : ''}
             title="點一下看這個章">
          ${hasPhoto ? `<span class="sticker-overlay">${renderStickerHTML(sticker, {size:20})}</span>` : renderStickerHTML(sticker, {size:'80%'})}
          ${hasNote ? `<span class="badge-note">📝</span>` : ''}
        </div>
      `);
    } else {
      cells.push(`
        <div class="stamp-cell"
             data-theme="${t.id}" data-idx="${i}"
             title="點一下蓋章"></div>
      `);
    }
  }

  // Date pill
  let datePill = '';
  if (t.endDate) {
    const daysLeft = daysBetween(todayISO(), t.endDate);
    if (daysLeft < 0) {
      datePill = `<span class="date-pill expired">已過期</span>`;
    } else if (daysLeft <= 3) {
      datePill = `<span class="date-pill expiring">剩 ${daysLeft} 天</span>`;
    } else {
      datePill = `<span class="date-pill">${formatDate(t.startDate)} → ${formatDate(t.endDate)}</span>`;
    }
  }

  // Bottom actions
  let actions = '';
  if (status === 'completed') {
    const trophy = t.trophy || { name: t.reward || '獎勵', emoji: '🎁', photo: '' };
    const icon = trophy.photo
      ? `<img src="${trophy.photo}" style="width:28px;height:28px;border-radius:8px;object-fit:cover;flex-shrink:0;">`
      : `<span style="font-size:22px; display:inline-grid; place-items:center; width:28px; height:28px;">${renderStickerHTML(trophy.emoji || '🎁', {size:'100%'})}</span>`;
    actions = `
      <div class="completed-banner" data-action="open-trophy" data-theme="${t.id}" style="cursor:pointer;">
        ${icon}
        <span>已收進寶盒 · ${escapeHtml(trophy.name)}</span>
      </div>
    `;
  } else if (status === 'completed-pending') {
    actions = `
      <div class="theme-actions">
        <button class="btn btn-success" data-action="redeem" data-theme="${t.id}">
          🎁 兌換獎勵
        </button>
      </div>
    `;
  } else if (status === 'expired') {
    actions = `
      <div class="theme-actions">
        <button class="btn btn-soft" data-action="reset" data-theme="${t.id}">重新開始</button>
        <button class="btn btn-cancel" data-action="edit" data-theme="${t.id}">編輯期間</button>
      </div>
    `;
  } else {
    actions = `
      <div class="theme-actions">
        <button class="btn btn-primary" data-action="stamp" data-theme="${t.id}">
          ＋ 蓋章一個
        </button>
      </div>
    `;
  }

  return `
    <div class="theme-card ${status === 'completed' ? 'completed' : ''} ${status === 'expired' ? 'expired' : ''}"
         style="--theme-color:${color.main}; --theme-color-soft:${color.soft}">
      <div class="theme-head">
        <div class="theme-head-left">
          <div class="theme-sticker-big">${renderStickerHTML(t.sticker, {size:'80%'})}</div>
          <div style="min-width:0; flex:1;">
            <div class="theme-title">${escapeHtml(t.title)}</div>
            <div class="theme-reward">🎁 ${escapeHtml(t.reward || '尚未設定獎勵')}</div>
          </div>
        </div>
        <button class="theme-menu" data-action="menu" data-theme="${t.id}">⋯</button>
        <div class="dropdown ${view.openMenuId === t.id ? 'show' : ''}" id="menu-${t.id}">
          <div class="dropdown-item" data-action="edit" data-theme="${t.id}">✏️ 編輯</div>
          <div class="dropdown-item" data-action="reset" data-theme="${t.id}">🔄 重設集點</div>
          <div class="dropdown-item danger" data-action="delete" data-theme="${t.id}">🗑️ 刪除</div>
        </div>
      </div>

      <div class="stamp-grid">
        ${cells.join('')}
      </div>

      <div class="theme-meta">
        <div class="progress-text">
          <strong>${t.points}</strong> / ${t.goal} 點
        </div>
        ${datePill}
      </div>

      ${actions}
    </div>
  `;
}

function toggleMenu(tid) {
  view.openMenuId = view.openMenuId === tid ? null : tid;
  render();
}
function closeAllMenus() {
  if (view.openMenuId) {
    view.openMenuId = null;
    render();
  }
}

    d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ',' + (cy + Math.sin(a) * rr).toFixed(1);

function renderHistory() {
  const content = document.getElementById('content');

  const kid = view.kidId ? state.kids.find(k => k.id === view.kidId) : null;

  // Collect trophies for current kid (or all if none selected)
  const trophyThemes = state.themes
    .filter(t => t.redeemedAt && (!view.kidId || t.kidId === view.kidId))
    .sort((a, b) => b.redeemedAt - a.redeemedAt);

  // Stats scoped to current kid
  const scopedThemes = state.themes.filter(t => !view.kidId || t.kidId === view.kidId);
  const totalStamps = scopedThemes.reduce((sum, t) => sum + (t.stamps ? t.stamps.length : t.points || 0), 0);
  const totalRedeems = trophyThemes.length;
  const activeThemesCount = scopedThemes.filter(t => themeStatus(t) === 'active' || themeStatus(t) === 'completed-pending').length;

  // Pad trophy grid with empty slots so grid feels generous
  const slotCount = Math.max(6, Math.ceil((trophyThemes.length + 2) / 3) * 3);
  const slots = [];
  for (let i = 0; i < slotCount; i++) {
    const tt = trophyThemes[i];
    if (tt) {
      const trophy = tt.trophy || { name: tt.reward || '寶物', photo: '', emoji: '🎁' };
      const hasPhoto = !!trophy.photo;
      slots.push(`
        <div class="trophy-slot has-trophy" data-theme="${tt.id}">
          <div class="trophy-medallion">
            <div class="trophy-inner">
              ${hasPhoto
                ? `<img class="trophy-photo" src="${trophy.photo}" alt="${escapeHtml(trophy.name)}">`
                : `<span class="trophy-emoji">${renderStickerHTML(trophy.emoji || '🎁', {size:'80%'})}</span>`
              }
            </div>
          </div>
          <div class="trophy-sparkle" style="top:-6px; right:6px;">✨</div>
          <div class="trophy-sparkle" style="bottom:18px; left:-4px;">✦</div>
          <div class="trophy-label">${escapeHtml(trophy.name)}</div>
        </div>
      `);
    } else {
      slots.push(`<div class="trophy-slot empty">?</div>`);
    }
  }

  // History events scoped to current kid
  let events = state.history.filter(h => {
    if (view.kidId) {
      const t = state.themes.find(tt => tt.id === h.themeId);
      if (h.type !== 'create_kid' && h.type !== 'delete_kid') {
        if (t && t.kidId !== view.kidId) return false;
        if (!t && h.kidId && h.kidId !== view.kidId) return false;
      } else {
        if (h.kidId && h.kidId !== view.kidId) return false;
      }
    }
    if (historyFilter === 'all') return true;
    if (historyFilter === 'stamp') return h.type === 'stamp' || h.type === 'unstamp';
    if (historyFilter === 'redeem') return h.type === 'redeem';
    if (historyFilter === 'theme') return h.type === 'create_theme' || h.type === 'delete_theme' || h.type === 'reset_theme';
    return true;
  });

  const groups = {};
  events.forEach(e => {
    const day = new Date(e.timestamp).toISOString().slice(0, 10);
    (groups[day] = groups[day] || []).push(e);
  });
  const days = Object.keys(groups).sort().reverse();

  const kidLabel = kid ? `<span class="inline-avatar">${renderStickerHTML(kid.avatar, {size:'100%', round:true})}</span> ${escapeHtml(kid.name)} 的` : '';

  content.innerHTML = `
    <div class="cosmos">
      <div class="cosmos-content">
        <div class="vault-title">${kidLabel}小寶盒</div>
        <div class="vault-sub">TREASURE GALAXY</div>
        ${spaceHeroSVG(kid)}

        <div class="vault-stats">
          <div class="vault-stat">
            <div class="vault-stat-value">${totalStamps}</div>
            <div class="vault-stat-label">累計集點</div>
          </div>
          <div class="vault-stat">
            <div class="vault-stat-value">${totalRedeems}</div>
            <div class="vault-stat-label">寶物數量</div>
          </div>
          <div class="vault-stat">
            <div class="vault-stat-value">${activeThemesCount}</div>
            <div class="vault-stat-label">進行中</div>
          </div>
        </div>

        <div class="space-blob">
        ${trophyThemes.length > 0 ? `
          <div class="vault-section-title">收藏的寶物</div>
          <div class="trophy-grid">${slots.join('')}</div>
        ` : `
          <div class="vault-empty">
            <div class="vault-empty-icon"><svg viewBox="0 0 40 40" width="52" height="52">${vaultStar(20, 21, 17, 0, 'v-tw', 0)}</svg></div>
            <div class="vault-empty-title">寶盒還是空的喔</div>
            <div class="vault-empty-text">集滿一張卡兌換獎勵，<br>就會出現在這個小宇宙裡</div>
          </div>
        `}
        </div>

        <div class="vault-section-title">活動歷程</div>

        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
          <div class="history-filters" style="margin-bottom:0;">
            <button class="filter-chip ${historyFilter==='all'?'active':''}" data-f="all">全部</button>
            <button class="filter-chip ${historyFilter==='stamp'?'active':''}" data-f="stamp">集點</button>
            <button class="filter-chip ${historyFilter==='redeem'?'active':''}" data-f="redeem">兌換</button>
            <button class="filter-chip ${historyFilter==='theme'?'active':''}" data-f="theme">主題變更</button>
          </div>
          <button class="polaroid-export-all-btn" onclick="exportAllPolaroids()">📥 全部匯出</button>
        </div>

        ${days.length === 0 ? `
          <div class="vault-empty" style="padding:18px 12px;">
            <div style="font-size:34px; margin-bottom:6px;">📸</div>
            <div class="vault-empty-text">還沒有拍立得記錄</div>
          </div>
        ` : days.map(day => `
          <div class="history-day">
            <div class="history-date">${formatDayHeader(day)}</div>
            <div class="polaroid-grid">
              ${groups[day].map(renderHistoryItem).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  // Trophy clicks
  content.querySelectorAll('.trophy-slot.has-trophy').forEach(el => {
    el.onclick = () => openTrophyDetail(el.dataset.theme);
  });
  // Filter chips
  content.querySelectorAll('.filter-chip').forEach(c => {
    c.onclick = () => { historyFilter = c.dataset.f; renderHistory(); };
  });
  // History thumbnail clicks → lightbox
  content.querySelectorAll('.history-thumb').forEach(img => {
    img.onclick = (e) => { e.stopPropagation(); openLightbox(img.src); };
  });
}

// ---- Trophy detail modal ----

  const trophy = t.trophy || { name: t.reward || '寶物', photo: '', emoji: '🎁' };
  const kid = state.kids.find(k => k.id === t.kidId);
  const d = new Date(t.redeemedAt);
  const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;

  openModal(`
    <div class="modal-handle"></div>
    <div class="trophy-detail">
      <div class="trophy-detail-medal">
        <div class="trophy-detail-inner">
          ${trophy.photo
            ? `<img src="${trophy.photo}" alt="${escapeHtml(trophy.name)}" id="trophyImg">`
            : `<span style="display:grid; place-items:center; width:100%; height:100%;">${renderStickerHTML(trophy.emoji || '🎁', {size:'80%'})}</span>`
          }

function formatDayHeader(iso) {
  const today = todayISO();
  if (iso === today) return '今天 · ' + iso;
  if (iso === addDaysISO(today, -1)) return '昨天 · ' + iso;
  const d = new Date(iso);
  const weekdays = ['日','一','二','三','四','五','六'];
  return `${iso}（週${weekdays[d.getDay()]}）`;
}

function renderHistoryItem(h) {
  const t = state.themes.find(tt => tt.id === h.themeId);
  const kid = state.kids.find(k => k.id === (h.kidId || (t && t.kidId)));
  const kidName = kid ? kid.name : '';
  let icon = '🔹', msg = '', caption = '', photo = '';

  // Look up the actual stamp record from the theme so we can render reason + photo
  // without having to store them in the history event itself (keeps storage small).
  const stampRec = h.stampId && t ? (t.stamps || []).find(s => s.id === h.stampId) : null;

  switch (h.type) {
    case 'stamp':
      icon = (stampRec && stampRec.sticker) || h.sticker || (t && t.sticker) || '⭐';
      const rReason = (stampRec && stampRec.reason) || h.reason || '';
      msg = rReason || `${kidName}集點 · 第${h.pointAt}點`;
      caption = rReason ? `${kidName} 第${h.pointAt}點` : '';
      photo = (stampRec && stampRec.photo) || h.photo || '';
      break;
    case 'unstamp':
      icon = '↩️';
      msg = `撤銷章 · ${kidName}`;
      break;
    case 'redeem':
      icon = (t && t.trophy && t.trophy.emoji) || h.trophyEmoji || '🎁';
      msg = `${kidName} 兌換了「${(t && t.trophy && t.trophy.name) || h.reward || '寶物'}」🎉`;
      photo = (t && t.trophy && t.trophy.photo) || h.trophyPhoto || '';
      break;
    case 'create_theme':
      icon = '✨';
      msg = `新主題：${h.themeTitle}`;
      break;
    case 'delete_theme':
      icon = '🗑️';
      msg = `刪除主題：${h.themeTitle}`;
      break;
    case 'reset_theme':
      icon = '🔄';
      msg = `重設：${h.themeTitle}`;
      break;
    case 'edit_theme':
      icon = '✏️';
      msg = `更新：${h.themeTitle}`;
      break;
    case 'create_kid':
      icon = (kid && kid.avatar) || '👶';
      msg = `新增 ${h.kidName}`;
      break;
    case 'delete_kid':
      icon = '👋';
      msg = `移除 ${h.kidName}`;
      break;
    case 'edit_kid':
      icon = (kid && kid.avatar) || '✏️';
      msg = `編輯 ${h.kidName}`;
      break;
  }

  const d = new Date(h.timestamp);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  // Gentle tilt: deterministic from timestamp
  const tilt = ((h.timestamp % 9) - 4) * 0.55;

  const photoArea = photo
    ? `<img src="${escapeAttr(photo)}" alt="">
       <div class="polaroid-icon-badge">${renderStickerHTML(icon, {size:14})}</div>`
    : `<div class="polaroid-sticker-bg">${renderStickerHTML(icon, {size:'56px'})}</div>`;

  const displayMsg = msg;
  const subMsg = caption;

  return `
    <div class="history-polaroid" style="--tilt:${tilt}deg"
         data-sticker="${escapeAttr(icon)}"
         data-photo="${escapeAttr(photo)}"
         data-msg="${escapeAttr(displayMsg)}"
         data-sub="${escapeAttr(subMsg)}"
         data-time="${escapeAttr(hh+':'+mm)}">
      <div class="polaroid-photo-area">
        ${photoArea}
      </div>
      <div class="polaroid-caption">
        <div class="polaroid-msg">${escapeHtml(displayMsg)}</div>
        ${subMsg ? `<div class="polaroid-time">${escapeHtml(subMsg)} · ${hh}:${mm}</div>` : `<div class="polaroid-time">${hh}:${mm}</div>`}
      </div>
      <button class="polaroid-save-btn" title="儲存為拍立得圖片" onclick="event.stopPropagation(); exportPolaroid(this)">💾</button>
    </div>
  `;
}

// ---- Polaroid export functions ----
function exportPolaroid(btn) {
  const card = btn.closest('.history-polaroid');
  const photo = card.dataset.photo;
  const msg   = card.dataset.msg;
  const time  = card.dataset.time;
  const sticker = card.dataset.sticker;

  const PAD = 22, SIZE = 380, CAPTION_H = 84;
  const W = SIZE + PAD * 2, H = SIZE + CAPTION_H + PAD * 2;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const render = (photoImg) => {
    // White background
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);

    // Photo area fill
    ctx.fillStyle = '#f0ece6';
    ctx.fillRect(PAD, PAD, SIZE, SIZE);

    if (photoImg) {
      const s = Math.min(photoImg.width, photoImg.height);
      const sx = (photoImg.width - s) / 2, sy = (photoImg.height - s) / 2;
      ctx.drawImage(photoImg, sx, sy, s, s, PAD, PAD, SIZE, SIZE);
    } else {
      // Gradient background + sticker
      const grad = ctx.createLinearGradient(PAD, PAD, PAD + SIZE, PAD + SIZE);
      grad.addColorStop(0, '#FFF8F0');
      grad.addColorStop(1, '#FEF0CC');
      ctx.fillStyle = grad;
      ctx.fillRect(PAD, PAD, SIZE, SIZE);
      ctx.font = `${Math.round(SIZE * 0.36)}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(sticker, W / 2, PAD + SIZE / 2);
    }

    // Caption region
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, PAD + SIZE, W, CAPTION_H + PAD);

    // Subtle divider
    ctx.strokeStyle = '#e8e4de';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD, PAD + SIZE + 14);
    ctx.lineTo(W - PAD, PAD + SIZE + 14);
    ctx.stroke();

    // Message
    ctx.fillStyle = '#2B2A33';
    ctx.font = `bold 17px -apple-system, "PingFang TC", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    let msgText = msg;
    const maxTW = SIZE - 8;
    while (ctx.measureText(msgText + '…').width > maxTW && msgText.length > 1) {
      msgText = msgText.slice(0, -1);
    }
    if (msgText !== msg) msgText += '…';
    ctx.fillText(msgText, W / 2, PAD + SIZE + 42);

    // Time
    ctx.fillStyle = '#bbb';
    ctx.font = `13px monospace`;
    ctx.fillText(time, W / 2, PAD + SIZE + 64);

    // Branding watermark
    ctx.fillStyle = '#d8d4ce';
    ctx.font = `11px -apple-system, "PingFang TC", sans-serif`;
    ctx.fillText('集點寶貝 ✦ Reward Stars', W / 2, H - 9);

    const link = document.createElement('a');
    link.download = `集點寶貝-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  };

  if (photo) {
    const img = new Image();
    img.onload = () => render(img);
    img.onerror = () => render(null);
    img.src = photo;
  } else {
    render(null);
  }
}

// "stamp" entry point: opens stamp dialog (reason + photo + sticker pick)
function stamp(tid) {
  const t = state.themes.find(x => x.id === tid);
  if (!t) return;
  if (themeStatus(t) === 'expired') { toast('這張卡已經過期囉'); return; }
  if (t.points >= t.goal) { toast('已經集滿啦 🎉'); return; }
  if (t.redeemedAt) { toast('已兌換的卡片無法再蓋章'); return; }
  openStampDialog(tid);
}
function stampFirstEmpty(tid) { stamp(tid); }

// Actually adds a stamp record after the dialog
function commitStamp(tid, payload) {
  const t = state.themes.find(x => x.id === tid);
  if (!t) return;
  const record = {
    id: uid('s'),
    at: Date.now(),
    sticker: payload.sticker || t.sticker || '⭐',
    reason: payload.reason || '',
    photo: payload.photo || '',
  };
  t.stamps.push(record);
  t.points = t.stamps.length;
  // Note: do NOT store photo/reason bytes in history event — the polaroid renderer
  // reads them from theme.stamps[i] via stampId, so we only need a reference here.
  // This keeps localStorage small and avoids saveState() slowdowns.
  logEvent('stamp', {
    themeId: t.id,
    themeTitle: t.title,
    kidId: t.kidId,
    pointAt: t.points,
    stampId: record.id,
    sticker: record.sticker,
  });
  saveState();
  render();
  // Play celebration animation
  playStampAnimation(record.sticker, t);
  if (t.points === t.goal) {
    setTimeout(() => {
      burstConfetti();
      toast('集滿了！可以兌換獎勵囉 🎉');
    }, 900);
  }
}

// Remove a specific stamp by index
function removeStamp(tid, stampIdx) {
  const t = state.themes.find(x => x.id === tid);
  if (!t) return;
  if (t.redeemedAt) { toast('已兌換的紀錄無法修改'); return; }
  if (stampIdx < 0 || stampIdx >= t.stamps.length) return;
  const removed = t.stamps.splice(stampIdx, 1)[0];
  t.points = t.stamps.length;
  logEvent('unstamp', {
    themeId: t.id,
    themeTitle: t.title,
    kidId: t.kidId,
    sticker: removed && removed.sticker,
  });
  saveState();
  render();
}

// ---- Image compression ----
function compressImageFile(file, maxSize) {
  return new Promise((resolve, reject) => {
    if (!file) return reject(new Error('no file'));
    if (file.size > 20 * 1024 * 1024) return reject(new Error('檔案太大（>20MB）'));
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const max = maxSize || 720;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        try {
          const url = canvas.toDataURL('image/jpeg', 0.78);
          resolve(url);
        } catch (err) { reject(err); }
      };
      img.onerror = () => reject(new Error('無法讀取圖片'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('無法開啟檔案'));
    reader.readAsDataURL(file);
  });
}

function stickerNameHTML(item) {

// ---- Arc card picker (弧形轉動卡片) ----
function openArcPicker(items, currentValue, onPick) {
  if (!items.length) { toast('圖庫裡還沒有貼紙'); return; }
  const n = items.length;
  let idx = Math.max(0, items.findIndex(x => x.value === currentValue));
  let pos = idx, target = idx, vel = 0, raf = 0, lastCurrent = -1;

  const wrap = document.createElement('div');
  wrap.className = 'arc-picker';
  wrap.innerHTML = `
    <div class="arc-top">
      <button type="button" class="arc-icon-btn" data-act="close" aria-label="返回">‹</button>
      <button type="button" class="arc-icon-btn" data-act="random" aria-label="隨機">🎲</button>
    </div>
    <div class="arc-head">
      <div class="arc-kicker">今天的好表現</div>
      <div class="arc-title">選一張貼紙</div>
      <div class="arc-count" id="arcCount"></div>
    </div>
    <div class="arc-stage" id="arcStage">
      <div class="arc-pick-me" id="arcPickMe">PICK ME</div>
      ${items.map((it, i) => `
        <button type="button" class="arc-card" data-i="${i}">
          <span class="arc-face">${it.type === 'image' ? `<img src="${escapeAttr(it.src)}" alt="" draggable="false">` : `<span>${escapeHtml(it.value)}</span>`}</span>
          ${stickerNameHTML(it)}
        </button>`).join('')}
    </div>
    <div class="arc-hint">左右滑動，點中間的卡片選它</div>
    <div class="arc-strip" id="arcStrip">
      ${items.map((it, i) => `<button type="button" class="arc-strip-item" data-i="${i}">${it.type === 'image' ? `<img src="${escapeAttr(it.src)}" alt="" draggable="false">` : escapeHtml(it.value)}</button>`).join('')}
    </div>
    <div class="arc-bottom">
      <button type="button" class="arc-confirm" data-act="confirm">就選這張！</button>
    </div>
  `;
  document.body.appendChild(wrap);

  const stage = wrap.querySelector('#arcStage');
  const cards = [...wrap.querySelectorAll('.arc-card')];
  const strip = wrap.querySelector('#arcStrip');
  const stripItems = [...strip.querySelectorAll('.arc-strip-item')];
  const pickMe = wrap.querySelector('#arcPickMe');
  const countEl = wrap.querySelector('#arcCount');
  const chosenIdx = idx;
  if (cards[chosenIdx]) cards[chosenIdx].classList.add('is-chosen');

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function layout() {
    const w = stage.clientWidth;
    const spread = Math.min(Math.max(w * 0.42, 140), 230); // horizontal step between cards
    cards.forEach((c, i) => {
      const d = i - pos;
      const ad = Math.abs(d);
      if (ad > 3.2) { c.style.visibility = 'hidden'; return; }
      c.style.visibility = 'visible';
      const a = d * 0.24;                                 // radians along the arc
      const R = spread / 0.24;                            // arc radius
      const x = Math.sin(a) * R;
      const y = (1 - Math.cos(a)) * R * 0.9 + ad * 6;
      const s = 1 - Math.min(ad, 3) * 0.12;
      c.style.transform = `translate3d(${x}px, ${y}px, ${-ad * 60}px) rotateZ(${a * 32}deg) rotateY(${-d * 18}deg) scale(${s})`;
      c.style.zIndex = String(100 - Math.round(ad * 10));
      c.style.opacity = String(clamp(1.6 - ad * 0.45, 0, 1));
    });
    const cur = clamp(Math.round(pos), 0, n - 1);
    if (cur !== lastCurrent) setCurrent(cur);
  }

  function setCurrent(cur) {
    if (lastCurrent >= 0 && cards[lastCurrent]) {
      cards[lastCurrent].classList.remove('is-current');
      stripItems[lastCurrent].classList.remove('on');
    }
    lastCurrent = cur;
    cards[cur].classList.add('is-current');
    stripItems[cur].classList.add('on');
    const face = cards[cur].querySelector('.arc-face');
    face.classList.remove('swap'); void face.offsetWidth; face.classList.add('swap');
    pickMe.classList.remove('pop'); void pickMe.offsetWidth; pickMe.classList.add('pop');
    countEl.textContent = `${cur + 1} / ${n}`;
    const si = stripItems[cur];
    strip.scrollLeft = si.offsetLeft - strip.clientWidth / 2 + si.offsetWidth / 2;
    if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) { try { navigator.vibrate(6); } catch (e) {} }
  }

  // Under-damped spring → the arc overshoots a little and settles (Q彈)
  function tick() {
    const k = 0.085, damping = 0.74;
    vel = (vel + (target - pos) * k) * damping;
    pos += vel;
    if (Math.abs(target - pos) < 0.001 && Math.abs(vel) < 0.001) { pos = target; layout(); raf = 0; return; }
    layout();
    raf = requestAnimationFrame(tick);
  }
  function go(i) {
    target = clamp(i, 0, n - 1);
    if (!raf) raf = requestAnimationFrame(tick);
  }

  // Drag / swipe
  let dragging = false, moved = false, startX = 0, startPos = 0, lastX = 0, lastT = 0, flick = 0;
  stage.addEventListener('pointerdown', e => {
    dragging = true; moved = false;
    startX = lastX = e.clientX; startPos = pos; lastT = performance.now(); flick = 0;
    cancelAnimationFrame(raf); raf = 0; vel = 0;
  });
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  function onMove(e) {
    if (!dragging) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 6 && !moved) { moved = true; stage.classList.add('dragging'); }
    if (!moved) return;
    const step = Math.min(Math.max(stage.clientWidth * 0.42, 140), 230);
    let p = startPos - dx / step;
    if (p < 0) p = p * 0.35;                       // rubber-band at the ends
    if (p > n - 1) p = (n - 1) + (p - (n - 1)) * 0.35;
    const now = performance.now();
    flick = (lastX - e.clientX) / step / Math.max(1, now - lastT) * 16;
    lastX = e.clientX; lastT = now;
    pos = p; layout();
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    stage.classList.remove('dragging');
    if (moved) go(Math.round(pos + clamp(flick * 5, -3, 3)));
  }

  stage.addEventListener('wheel', e => {
    e.preventDefault();
    go(Math.round(target + Math.sign(e.deltaX || e.deltaY)));
  }, { passive: false });

  cards.forEach(c => c.addEventListener('click', () => {
    if (moved) return;
    const i = +c.dataset.i;
    if (i === lastCurrent) confirm(); else go(i);
  }));
  stripItems.forEach(s => s.addEventListener('click', () => go(+s.dataset.i)));

  function onKey(e) {
    if (e.key === 'ArrowLeft') go(target - 1);
    else if (e.key === 'ArrowRight') go(target + 1);
    else if (e.key === 'Enter') confirm();
    else if (e.key === 'Escape') close();
  }
  window.addEventListener('keydown', onKey);

  function close() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    window.removeEventListener('keydown', onKey);
    cancelAnimationFrame(raf);
    wrap.classList.add('closing');
    setTimeout(() => wrap.remove(), 280);
  }
  function confirm() {
    const cur = lastCurrent;
    const card = cards[cur];
    card.animate([
      { transform: card.style.transform },
      { transform: card.style.transform + ' scale(1.14)' },
      { transform: card.style.transform + ' scale(.96)' },
      { transform: card.style.transform },
    ], { duration: 380, easing: 'cubic-bezier(.34,1.56,.64,1)' });
    onPick(items[cur].value);
    setTimeout(close, 300);
  }

  wrap.querySelector('[data-act="close"]').onclick = close;
  wrap.querySelector('[data-act="confirm"]').onclick = confirm;
  wrap.querySelector('[data-act="random"]').onclick = () => {
    let r = Math.floor(Math.random() * n);
    if (n > 1 && r === lastCurrent) r = (r + 1) % n;
    go(r);
  };

  layout();
}

// ---- Stamp detail (view a specific stamp) ----
function openStampDetail(tid, stampIdx) {
  const t = state.themes.find(x => x.id === tid);
  if (!t) return;
  const s = t.stamps[stampIdx];
  if (!s) return;
  const color = COLORS.find(c => c.name === t.color) || COLORS[0];
  const d = new Date(s.at);
  const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

  openModal(`
    <div class="modal-handle"></div>
    <div class="stamp-detail" style="--theme-color:${color.main}">
      <div class="stamp-detail-sticker">${renderStickerHTML(s.sticker || t.sticker || '⭐', {size:96})}</div>
      <div class="stamp-detail-date">${escapeHtml(t.title)} · 第 ${stampIdx + 1} 點 · ${dateStr}</div>
      ${s.photo ? `<img class="stamp-detail-photo" src="${s.photo}" alt="紀念照" id="stampDetailPhoto">` : ''}
      ${s.reason ? `<div class="stamp-detail-reason">${escapeHtml(s.reason)}</div>` : ''}
      ${!s.reason && !s.photo ? `<div class="stamp-detail-empty">這次沒有記錄理由或照片</div>` : ''}
    </div>
    <div class="modal-actions">
      ${!t.redeemedAt ? `<button class="btn btn-delete" id="stampUndo">撤銷這次蓋章</button>` : ''}
      <button class="btn btn-primary" id="stampDetailClose">完成</button>
    </div>
  `);
  document.getElementById('stampDetailClose').onclick = closeModal;
  if (!t.redeemedAt) {
    document.getElementById('stampUndo').onclick = () => {
      closeModal();
      setTimeout(() => removeStamp(tid, stampIdx), 150);
    };
  }
  const photoEl = document.getElementById('stampDetailPhoto');
  if (photoEl) photoEl.onclick = () => openLightbox(s.photo);
}

      ${Object.keys(CAT_LABELS).map(c => `
        <button class="lib-tab ${libView.cat===c?'active':''}" data-cat="${c}"><span class="lib-tab-ill">${LIB_ICONS[c]}</span><span>${CAT_LABELS[c]}</span></button>
      `).join('')}
    </div>

    <div id="libContent"></div>

    <div class="modal-actions">
      <button class="btn btn-primary" id="libClose" style="flex:1">完成</button>
    </div>
  `);

  document.querySelectorAll('#libTabs .lib-tab').forEach(b => {
    b.onclick = () => { libView.cat = b.dataset.cat; openLibrary(); };
  });
  document.getElementById('libClose').onclick = () => { closeModal(); render(); };
  const activeTab = document.querySelector('#libTabs .lib-tab.active');
  if (activeTab) activeTab.scrollIntoView({ block: 'nearest', inline: 'center' });

  renderLibraryContent();
}

function builtinIllustration(key) {
  try {
    let html = '';
    if (key === 'welcome') html = renderWelcome();
    else if (key === 'empty') html = renderEmptyThemes({ name: '', color: (COLORS[0] || {}).name });
    else if (key === 'logo') return `<div class="illust-builtin">${BRAND_LOGO_SVG}</div>`;
    else return '';
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const svg = doc.querySelector('svg.empty-illust');
    if (!svg) return '';
    // give the grain filter a unique id so it doesn't clash with the page
    let out = svg.outerHTML.replace(/id="(grain[WE])"/, 'id="$1lib"').replace(/url\(#(grain[WE])\)/, 'url(#$1lib)');
    return `<div class="illust-builtin">${out}</div>`;
  } catch (e) { return ''; }
}
function renderLibraryContent() {
  const container = document.getElementById('libContent');
  if (!container) return;

  if (libView.cat === 'illustrations') {
    container.innerHTML = ILLUST_SLOTS.map(slot => {
      const customSrc = customLib.illustrations[slot.key];
      const bundledSrc = bundledLib.illustrations[slot.key];
      const src = customSrc || bundledSrc;
      const sourceLabel = customSrc ? '我上傳的' : bundledSrc ? '部署資料夾' : '內建插畫';
      return `
        <div class="illust-row">
          <div class="illust-preview">
            ${src
              ? `<img src="${escapeAttr(src)}" alt="${escapeHtml(slot.name)}">`
              : (builtinIllustration(slot.key) || `<div class="illust-preview-empty">使用內建插畫<br>(可上傳替換)</div>`)}
          </div>
          <div class="illust-info">
            <div class="illust-name">${escapeHtml(slot.name)} <span style="font-size:10px; font-weight:600; color:var(--ink-faint);">· ${sourceLabel}</span></div>
            <div class="illust-desc">${escapeHtml(slot.desc)}</div>
            <div class="illust-actions">
              <button class="small-icon-btn" data-illust-upload="${slot.key}"><span class="btn-ill">${LIB_ICONS.camera}</span>上傳</button>
              ${customSrc ? `<button class="small-icon-btn" style="color:var(--danger)" data-illust-remove="${slot.key}">移除</button>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('[data-illust-upload]').forEach(b => {
      b.onclick = () => pickIllustrationFile(b.dataset.illustUpload);
    });
    container.querySelectorAll('[data-illust-remove]').forEach(b => {
      b.onclick = () => {
        delete customLib.illustrations[b.dataset.illustRemove];
        saveCustomLib();
        renderLibraryContent();
        toast('已移除');
      };
    });
    return;
  }

  const cat = libView.cat;
  const bundled = bundledLib[cat] || [];
  const custom = customLib[cat] || [];

  let cells = '';
  cells += bundled.map(it => `
    <div class="lib-item">
      <div class="lib-item-source bundled">部署</div>
      <img src="${escapeAttr(it.src)}" alt="">
    </div>
  `).join('');
  cells += custom.map(it => `
    <div class="lib-item">
      <div class="lib-item-source custom">我的</div>
      <img src="${escapeAttr(it.src)}" alt="">
      <button class="lib-item-delete" data-del="${it.id}">✕</button>
    </div>
  `).join('');

  cells += `
    <div class="lib-upload" id="libUploadBtn">
      <div>
        <div class="lib-upload-ill">${LIB_ICONS.upload}</div>
        <div>上傳圖檔</div>
      </div>
    </div>
  `;

  container.innerHTML = `
    <div class="lib-grid">
      ${cells}
    </div>
    <div style="font-size:11px; color:var(--ink-faint); padding:0 4px;">
      建議：正方形 PNG（透明背景），尺寸 256×256，每張壓縮後 &lt; 200KB
    </div>
    <input type="file" id="libFile" accept="image/*" multiple style="display:none">
  `;

  const fileInput = document.getElementById('libFile');
  document.getElementById('libUploadBtn').onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const files = Array.from(fileInput.files || []);
    if (!files.length) return;
    for (const f of files) {
      try {
        const dataUrl = await compressImageFile(f);
        customLib[cat].push({
          id: 'c_' + uid('img'),
          src: dataUrl,
          label: f.name.replace(/\.[^.]+$/, ''),
          source: 'custom',
        });
      } catch (e) {
        console.warn('compress failed', e);
        toast('一張圖檔處理失敗：' + (f.name || ''));
      }
    }
    saveCustomLib();
    renderLibraryContent();
    toast(`已加入 ${files.length} 張圖`);
    fileInput.value = '';
  };

  container.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.del;
      customLib[cat] = customLib[cat].filter(it => it.id !== id);
      saveCustomLib();
      renderLibraryContent();
      toast('已刪除');
    };
  });
}

function pickIllustrationFile(key) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (f) {
      try {
        // illustrations get a slightly larger compression (longer edge 1024)
        const dataUrl = await compressImageFile(f, 1024);
        customLib.illustrations[key] = dataUrl;
        saveCustomLib();
        renderLibraryContent();
        toast('插畫已更新');
      } catch (e) {
        toast(e.message || '圖檔處理失敗');
      }
    }
    document.body.removeChild(inp);
  };
  inp.click();
}

        <div style="font-size:36px; margin-bottom:8px;">📸</div>
        <div style="font-weight:800; font-size:15px; color:var(--ink);">拍下這次的寶物</div>
        <div style="font-size:12px; color:var(--ink-soft); margin-top:4px;">讓寶盒裡有專屬的紀念照</div>
      </button>
    `;
    document.getElementById('rewardPickBtn').onclick = () => fileInput.click();
  }
  function showPreview(dataUrl) {
    wrap.innerHTML = `
      <div class="reward-photo-pick has-photo">
        <div class="reward-photo-preview-wrap">
          <img src="${dataUrl}" alt="寶物">
          <div class="reward-photo-celebrate">✨ 寶物紀念照</div>
          <button class="photo-remove" id="rewardRemove" type="button">✕</button>
        </div>
        <button class="small-icon-btn" id="rewardReplace" type="button" style="margin-top:8px;">🔄 換一張</button>
      </div>
    `;
    document.getElementById('rewardRemove').onclick = () => { draft.photo = ''; showPicker(); };
    document.getElementById('rewardReplace').onclick = () => fileInput.click();
  }
  showPicker();
  fileInput.onchange = async () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    wrap.innerHTML = `<div style="text-align:center;padding:30px;color:var(--ink-soft);">壓縮中…</div>`;
    try {
      const dataUrl = await compressImageFile(f);
      draft.photo = dataUrl;
      showPreview(dataUrl);
    } catch (e) {
      toast(e.message || '照片處理失敗');
      showPicker();
    }
    fileInput.value = '';
  };

  // Emoji picker
  upgradeStickerGrid('rewardEmojiGrid');
  document.querySelectorAll('#rewardEmojiGrid .sticker-opt').forEach(b => {

      document.querySelectorAll('#rewardEmojiGrid .sticker-opt').forEach(x => x.classList.remove('active'));

      themeId: t.id,
      themeTitle: t.title,
      kidId: t.kidId,
      reward: name,
      trophyEmoji: t.trophy.emoji,
    });
    saveState();
    closeModal();
    burstConfetti();
    toast(`🎉 ${name} 入手！收進小寶盒了！`);
    render();
  };
}

// ---- colour helpers (2.5D shading) ----
function avHex(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function avMix(h, t, k) { const a = avHex(h), b = avHex(t); return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * k).toString(16).padStart(2, '0')).join(''); }
const avLight = (h, k) => avMix(h, '#ffffff', k == null ? .22 : k);
const avDark = (h, k) => avMix(h, '#2a1a14', k == null ? .2 : k);

function limb(d, color, w) {
  w = w || 9;
  return `<path d="${d}" stroke="${avDark(color, .25)}" stroke-width="${w + 2}" stroke-linecap="round" fill="none"/>` +
    `<path d="${d}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" fill="none"/>` +
    `<path d="${d}" stroke="${avLight(color, .45)}" stroke-width="${(w * .3).toFixed(1)}" stroke-linecap="round" fill="none" opacity=".55" transform="translate(-1.5,0)"/>`;
}
function sparkle(x, y, r, c) {
  return `<path d="M${x},${y - r} Q${x},${y} ${x + r},${y} Q${x},${y} ${x},${y + r} Q${x},${y} ${x - r},${y} Q${x},${y} ${x},${y - r}Z" fill="${c || '#fff'}"/>`;
}
function dots(list, r, c) { return list.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`).join(''); }

function avOutfitBack(p) {
  const b = BACKS[p.back];
  return b && b.draw ? b.draw(p.backColor || b.def) : '';
}
function avBody(p) {
  const top = TOPS[p.top] || TOPS.tee, bot = BOTTOMS[p.bottom] || BOTTOMS.pants, shoe = SHOES[p.shoes] || SHOES.sneaker;
  const tc = p.topColor || top.def, bc = p.bottomColor || bot.def, sc = p.shoeColor || shoe.def;
  const skin = p.skin, sleeveC = top.sleeve === 'puff' ? avLight(tc, .45) : tc;
  let s = '';
  if (!bot.noLegs) {
    s += `<rect x="85" y="226" width="11" height="38" rx="5" fill="${skin}" ${AS}/><rect x="104" y="226" width="11" height="38" rx="5" fill="${skin}" ${AS}/>`;
    if (p.shoes === 'boots') s += `<rect x="83" y="242" width="15" height="24" rx="5" fill="${sc}" ${AS}/><rect x="102" y="242" width="15" height="24" rx="5" fill="${sc}" ${AS}/>`;
  }
  s += limb(ARM_L, skin) + limb(ARM_R, skin);
  if (top.sleeve === 'long') s += limb('M77,180 L65,214', sleeveC);
  if (top.sleeve === 'wide') s += limb('M77,180 L66,212', sleeveC, 16) + limb('M123,180 L134,212', sleeveC, 16);
  if (top.sleeve === 'long') s += limb('M123,180 L135,214', sleeveC);
  if (top.sleeve === 'short') s += limb('M77,180 L71,196', sleeveC, 11) + limb('M123,180 L129,196', sleeveC, 11);
  s += `<circle cx="62" cy="223" r="5.6" fill="${skin}" ${AS}/><circle cx="138" cy="223" r="5.6" fill="${skin}" ${AS}/>`;
  s += `<rect x="93" y="154" width="14" height="20" fill="${skin}" ${AS}/>`;
  s += `<path d="${TORSO}" fill="${skin}" ${AS}/>`;
  if (top.base === 'full') s += `<path d="${TORSO}" fill="${tc}" ${AS}/>`;
  if (top.base === 'off') s += `<path d="M78,184 C90,180 110,180 122,184 L123,208 L77,208Z" fill="${tc}" ${AS}/>`;
  if (top.base === 'crop') s += `<path d="M80,175 C82,169 90,166 100,166 C110,166 118,169 120,175 L121,192 C110,196 90,196 79,192Z" fill="${tc}" ${AS}/>`;
  if (top.sleeve === 'puff') s += `<ellipse cx="77" cy="180" rx="9" ry="8" fill="${sleeveC}" ${AS}/><ellipse cx="123" cy="180" rx="9" ry="8" fill="${sleeveC}" ${AS}/>`;
  if (top.extra) s += top.extra(tc, p);
  s += `<path d="${bot.d}" fill="${bc}" ${AS}/>`;
  if (bot.extra) s += bot.extra(bc, p);
  if (!bot.noLegs) {
    if (p.shoes === 'barefoot') s += `<ellipse cx="90" cy="265" rx="7" ry="4.5" fill="${skin}" ${AS}/><ellipse cx="110" cy="265" rx="7" ry="4.5" fill="${skin}" ${AS}/>`;
    else if (p.shoes === 'sandals') s += `<ellipse cx="90" cy="266" rx="8.5" ry="5" fill="${skin}" ${AS}/><ellipse cx="110" cy="266" rx="8.5" ry="5" fill="${skin}" ${AS}/><path d="M82,264 H98 M102,264 H118" stroke="${sc}" stroke-width="4" stroke-linecap="round"/><ellipse cx="90" cy="270" rx="9.5" ry="3" fill="${sc}"/><ellipse cx="110" cy="270" rx="9.5" ry="3" fill="${sc}"/>`;
    else if (p.shoes === 'flats') s += `<ellipse cx="89" cy="266" rx="9" ry="5" fill="${sc}" ${AS}/><ellipse cx="111" cy="266" rx="9" ry="5" fill="${sc}" ${AS}/><path d="M84,262 H95 M105,262 H116" stroke="${avDark(sc, .3)}" stroke-width="1.8"/>`;
    else s += `<ellipse cx="89" cy="266" rx="9.5" ry="5.6" fill="${sc}" ${AS}/><ellipse cx="111" cy="266" rx="9.5" ry="5.6" fill="${sc}" ${AS}/>`;
  }
  return s;
}

// Turn every outlined flat shape into a shaded one: fill → vertical gradient of its own colour,
// black ink outline → a soft darker edge. This is what gives clothes, hair and hats the 2.5D look.
function av25dShade(svg, pf) {
  const grads = new Map();
  const out = svg.replace(/<(path|rect|ellipse|circle)\b([^>]*?)\/>/g, (m, tag, attrs) => {
    const fill = (attrs.match(/fill="(#[0-9A-Fa-f]{6})"/) || [])[1];
    if (!fill || !attrs.includes(`stroke="${AV_INK}"`)) return m;
    const key = fill.slice(1).toLowerCase();
    if (!grads.has(key)) grads.set(key, `<linearGradient id="${pf}g${key}" x1=".2" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="${avLight(fill, .28)}"/><stop offset=".55" stop-color="${fill}"/><stop offset="1" stop-color="${avDark(fill, .18)}"/></linearGradient>`);
    const a = attrs.replace(`fill="${fill}"`, `fill="url(#${pf}g${key})"`)
      .replace(`stroke="${AV_INK}"`, `stroke="${avDark(fill, .22)}"`)
      .replace(/stroke-width="[\d.]+"/, 'stroke-width="1.3"');
    return `<${tag}${a}/>`;
  });
  return out.replace('</defs>', [...grads.values()].join('') + '</defs>');
}

function avatarSVG(parts, opts) {

      if (def.colorKey && parts[tab] !== v) {
        const pd = ({ top: TOPS, bottom: BOTTOMS, shoes: SHOES, back: BACKS })[tab][v];
        if (pd && pd.def) parts[def.colorKey] = pd.def;
      }
      parts[tab] = v;
      update();
    });
    optsEl.querySelectorAll('[data-hc]').forEach(b => b.onclick = () => { parts.hairColor = b.dataset.hc; update(); });
    optsEl.querySelectorAll('[data-cc]').forEach(b => b.onclick = () => { parts[def.colorKey] = b.dataset.cc; update(); });
  }
  function update() {
    boing(); renderOpts();
    onChange(Object.assign({}, parts));
  }
  host.querySelectorAll('.avm-tab').forEach(b => b.onclick = () => {
    tab = b.dataset.k;
    host.querySelectorAll('.avm-tab').forEach(x => x.classList.toggle('on', x === b));
    renderOpts();
    optsEl.classList.remove('swap'); void optsEl.offsetWidth; optsEl.classList.add('swap');
  });
  host.querySelector('#avmDice').onclick = () => {
    Object.assign(parts, randomAvatarParts());
    update();
  };
  renderOpts();
}

// ---- Misc ----
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function openBackupModal() {
  const kids = state.kids.length;
  const themes = state.themes.length;
  const stamps = state.themes.reduce((s, t) => s + (t.stamps ? t.stamps.length : 0), 0);
  const bytes = JSON.stringify(state).length;
  const kb = (bytes / 1024).toFixed(1);
  const d = new Date();
  const dateStr = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;

  openModal(`
    <div class="modal-handle"></div>
    <div class="modal-title modal-title-ill"><span class="title-ill">${headerIcon('backupBtn')}</span>備份 & 還原</div>
    <div class="modal-sub">資料存在這台裝置的瀏覽器裡，換瀏覽器或清除快取就需要重新匯入</div>

    <div style="background:var(--surface-2); border-radius:var(--r); padding:14px 16px; margin-bottom:18px;">
      <div style="font-size:13px; color:var(--ink-soft); margin-bottom:8px; font-weight:700;">目前的資料</div>
      <div style="display:flex; gap:16px; flex-wrap:wrap;">
        <span class="bk-stat"><span class="btn-ill">${LIB_ICONS.avatars}</span>${kids} 位小朋友</span>
        <span class="bk-stat"><span class="btn-ill">${LIB_ICONS.trophies}</span>${themes} 個主題</span>
        <span class="bk-stat"><span class="btn-ill">${LIB_ICONS.stickers}</span>${stamps} 個集點</span>
        <span style="font-size:13px; color:var(--ink-faint);">${kb} KB</span>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:18px;">
      <button class="btn btn-primary" id="doExport" style="justify-content:center; display:flex; align-items:center; gap:8px;">
        <span class="btn-ill bk-ill">${headerIcon('backupBtn')}</span>匯出備份檔（.json）
      </button>
      <label class="btn" style="background:var(--surface-2); color:var(--ink); justify-content:center; display:flex; align-items:center; gap:8px; cursor:pointer;">
        <span class="btn-ill bk-ill">${LIB_ICONS.upload}</span>匯入備份檔
        <input type="file" id="importFile" accept=".json" style="display:none">
      </label>
    </div>

    <div style="background:var(--surface-2); border-radius:var(--r); padding:12px 14px; font-size:12px; color:var(--ink-soft); line-height:1.6;">
      <strong>小提示：</strong>建議定期匯出備份，或換裝置/瀏覽器前先匯出，再在新瀏覽器裡匯入。照片和自訂圖庫也會一起備份。
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" id="backupClose">關閉</button>
    </div>
  `);

  document.getElementById('backupClose').onclick = closeModal;

  document.getElementById('doExport').onclick = async () => {
    try {
      const backup = {
        _app: '集點寶貝 Reward Stars',
        _version: 2,
        _exportedAt: new Date().toISOString(),
        state,
        customLib,
      };
      const json = JSON.stringify(backup, null, 2);
      const fileName = `集點寶貝備份-${dateStr}.json`;

      // iOS Safari: use Web Share API with file if available
      if (navigator.canShare) {
        const file = new File([json], fileName, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: '集點寶貝備份' });
          return;
        }
      }

      // Standard download (desktop / Android)
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('備份已下載！');
    } catch(e) {
      if (e.name !== 'AbortError') toast('匯出失敗：' + (e.message || e));
    }
  };

  document.getElementById('importFile').onchange = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const backup = JSON.parse(text);
      // Basic validation
      if (!backup.state || !backup.state.kids || !backup.state.themes) {
        toast('檔案格式不對，請選擇集點寶貝備份檔');
        return;
      }
      // Run migration on imported state
      (backup.state.themes || []).forEach(t => {
        if (!Array.isArray(t.stamps)) {
          t.stamps = Array.from({ length: Math.max(0, t.points || 0) }, (_, i) => ({
            id: uid('s'), at: (t.createdAt || Date.now()) + i * 60000,
            sticker: t.sticker || '⭐',
          }));
        }
        t.points = t.stamps.length;
      });
      // Confirm before overwriting
      closeModal();
      setTimeout(() => {
        openConfirm({
          icon: '📥',
          title: '確定要匯入備份？',
          text: `將會覆蓋現有的 ${kids} 位小朋友、${themes} 個主題的資料`,
          confirmLabel: '確定匯入',
          danger: true,
          onConfirm: () => {
            state = backup.state;
            if (backup.customLib) {
              customLib = backup.customLib;
              localStorage.setItem(LIBRARY_KEY, JSON.stringify(customLib));
            }
            saveState();
            closeModal();
            render();
            toast('✅ 匯入成功！');
          }
        });
      }, 150);
    } catch(e) {
      toast('讀取失敗：' + (e.message || '格式錯誤'));
    }
    e.target.value = '';
  };
}

// Brand motion · 形狀漸變 LOGO + 字塊掉落 + 點擊彩帶
// ============================================================
(function brandMotion() {
  const N = 96;
  const TAU = Math.PI * 2;
  const superellipse = p => th => 1 / Math.pow(Math.pow(Math.abs(Math.cos(th)), p) + Math.pow(Math.abs(Math.sin(th)), p), 1 / p);
  const poly = (m, round) => th => {
    const seg = TAU / m;
    const a = ((th % seg) + seg) % seg - seg / 2;
    return Math.cos(Math.PI / m) / Math.cos(a) * (1 - round) + round * 0.78;
  };
  const SHAPES = [
    th => 0.92 / Math.sqrt(Math.pow(Math.cos(th) * 0.92, 2) + Math.pow(Math.sin(th) * 1.15, 2)), // egg
    superellipse(3.2),                                       // pillow square
    superellipse(0.62),                                      // 4-point star
    poly(3, 0.35),                                           // soft triangle
    th => 0.82 + 0.18 * Math.cos(6 * th),                    // flower
    th => 0.62 + 0.38 * Math.pow((Math.cos(5 * th) + 1) / 2, 1.6), // 5-point star
  ];
  const COLORS = [['#FBC444','#F26FAE'], ['#4A7FD0','#F59A5E'], ['#F26FAE','#E5453A'], ['#F59A5E','#FBC444'], ['#E5453A','#F26FAE'], ['#FBC444','#4A7FD0']];
  const ROT = [-0.4, 0.785, 0.785, -1.57, 0, -1.57];
  const sample = (f, rot) => {
    const r = []; let max = 0;
    for (let i = 0; i < N; i++) { const v = f(i / N * TAU - rot); r.push(v); if (v > max) max = v; }
    return r.map(v => v / max);
  };
  const RADII = SHAPES.map((f, i) => sample(f, ROT[i]));
  const lerp = (a, b, t) => a + (b - a) * t;
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], Math.max(0, Math.min(1, t))))).join(',')})`; };
  // ease with a little overshoot → Q彈 morph
  const backOut = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  function pathFrom(r, R, spin) {
    const pts = r.map((v, i) => { const th = i / N * TAU + spin; return [Math.cos(th) * v * R, Math.sin(th) * v * R]; });
    let d = `M${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
    for (let i = 0; i < N; i++) {
      const p0 = pts[(i - 1 + N) % N], p1 = pts[i], p2 = pts[(i + 1) % N], p3 = pts[(i + 2) % N];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += `C${c1[0].toFixed(2)},${c1[1].toFixed(2)} ${c2[0].toFixed(2)},${c2[1].toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
    }
    return d + 'Z';
  }
  const HOLD = 900, MORPH = 750;
  let start = performance.now();
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now) {
    const path = document.querySelector('#brandIcon .morph-path');
    if (path && !document.hidden) {
      const el = Math.max(0, now - start), cycle = HOLD + MORPH;
      const k = Math.floor(el / cycle), local = el - k * cycle;
      const from = k % SHAPES.length, to = (k + 1) % SHAPES.length;
      const raw = local < HOLD ? 0 : (local - HOLD) / MORPH;
      const t = raw === 0 ? 0 : backOut(Math.min(1, raw));
      const r = RADII[from].map((v, i) => lerp(v, RADII[to][i], t));
      const breathe = 1 + 0.03 * Math.sin(now / 260);
      path.setAttribute('d', pathFrom(r, 27 * breathe, now / 4000));
      const stops = document.querySelectorAll('#brandGrad stop');
      if (stops.length === 2) {
        stops[0].setAttribute('stop-color', mix(COLORS[from][0], COLORS[to][0], raw));
        stops[1].setAttribute('stop-color', mix(COLORS[from][1], COLORS[to][1], raw));
      }
      const g = document.getElementById('brandGrad');
      if (g) g.setAttribute('gradientTransform', `rotate(${(now / 30) % 360} .5 .5)`);
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function dropTiles() {
    document.querySelectorAll('.brand-tile').forEach(t => {
      t.classList.remove('drop'); void t.offsetWidth; t.classList.add('drop');
    });
  }
  dropTiles();
  const brand = document.querySelector('.brand');
  if (brand) brand.addEventListener('click', () => { dropTiles(); start = performance.now() - HOLD; confettiBurst(brand.querySelector('.brand-icon') || brand); });
})();

// Confetti pieces drawn in the illustration style (sparkles, dashes, arcs, rings, plus)
function confettiBurst(el, count) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cols = ['#FBC444', '#F26FAE', '#E5453A', '#4A7FD0', '#F59A5E', '#2E5C49'];
  const SHAPES = [
    c => `<svg viewBox="-10 -10 20 20"><path d="M0,-10 C1.6,-1.6 1.6,-1.6 10,0 C1.6,1.6 1.6,1.6 0,10 C-1.6,1.6 -1.6,1.6 -10,0 C-1.6,-1.6 -1.6,-1.6 0,-10Z" fill="${c}"/></svg>`,
    c => `<svg viewBox="-10 -10 20 20"><path d="M-7,0 H7" stroke="${c}" stroke-width="4" stroke-linecap="round"/></svg>`,
    c => `<svg viewBox="-10 -10 20 20"><path d="M-7,-2 Q0,9 7,-2" stroke="${c}" stroke-width="3.6" fill="none" stroke-linecap="round"/></svg>`,
    c => `<svg viewBox="-10 -10 20 20"><circle r="5.5" stroke="${c}" stroke-width="3.4" fill="none"/></svg>`,
    c => `<svg viewBox="-10 -10 20 20"><path d="M0,-7 V7 M-7,0 H7" stroke="${c}" stroke-width="3.6" stroke-linecap="round"/></svg>`,
  ];
  const n = count || 12;
  for (let i = 0; i < n; i++) {
    const piece = document.createElement('div');
    piece.className = 'burst-piece';
    piece.innerHTML = SHAPES[i % SHAPES.length](cols[(i * 7 + Math.floor(Math.random() * 3)) % cols.length]);
    document.body.appendChild(piece);
    const ang = (i / n) * Math.PI * 2 + Math.random() * 0.5;
    const dist = 38 + Math.random() * 34;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
    const rot = (Math.random() - 0.5) * 300;
    const size = 0.8 + Math.random() * 0.7;
    const at = (x, y) => `translate(${cx + x - 8}px, ${cy + y - 8}px)`;
    piece.animate([
      { transform: `${at(0, 0)} scale(.2) rotate(0deg)`, opacity: 1 },
      { transform: `${at(dx, dy)} scale(${size}) rotate(${rot}deg)`, opacity: 1, offset: 0.55 },
      { transform: `${at(dx * 1.1, dy * 1.1 + 18)} scale(${size * 0.8}) rotate(${rot * 1.3}deg)`, opacity: 0 },
    ], { duration: 760 + Math.random() * 200, easing: 'cubic-bezier(.2,.9,.3,1.1)' }).onfinish = () => piece.remove();
  }
}
['libBtn', 'backupBtn'].forEach(id => {
  const b = document.getElementById(id);
  if (b) b.addEventListener('click', () => confettiBurst(b));
});

</script>
