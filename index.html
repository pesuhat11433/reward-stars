// ---- Backup / Restore ----
function openBackupModal() {
  const kids = state.kids.length;
  const themes = state.themes.length;
  const stamps = state.themes.reduce((s, t) => s + (t.stamps ? t.stamps.length : 0), 0);
  const bytes = JSON.stringify(state).length;
  const kb = (bytes / 1024).toFixed(1);
  const d = new Date();
  const dateStr = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;

  openModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">💾 備份 & 還原</div>
    <div class="modal-sub">資料存在這台裝置的瀏覽器裡，換瀏覽器或清除快取就需要重新匯入</div>

    <div style="background:var(--surface-2); border-radius:var(--r); padding:14px 16px; margin-bottom:18px;">
      <div style="font-size:13px; color:var(--ink-soft); margin-bottom:8px; font-weight:700;">目前的資料</div>
      <div style="display:flex; gap:16px; flex-wrap:wrap;">
        <span style="font-size:13px;">👶 ${kids} 位小朋友</span>
        <span style="font-size:13px;">📋 ${themes} 個主題</span>
        <span style="font-size:13px;">⭐ ${stamps} 個集點</span>
        <span style="font-size:13px; color:var(--ink-faint);">${kb} KB</span>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:18px;">
      <button class="btn btn-primary" id="doExport" style="justify-content:center; display:flex; align-items:center; gap:8px;">
        📤 匯出備份檔（.json）
      </button>
      <label class="btn" style="background:var(--mint-soft); color:#2C8262; justify-content:center; display:flex; align-items:center; gap:8px; cursor:pointer;">
        📥 匯入備份檔
        <input type="file" id="importFile" accept=".json" style="display:none">
      </label>
    </div>

    <div style="background:#FFF8F0; border-radius:var(--r); padding:12px 14px; font-size:12px; color:var(--ink-soft); line-height:1.6;">
      💡 <strong>小提示：</strong>建議定期匯出備份，或換裝置/瀏覽器前先匯出，再在新瀏覽器裡匯入。照片和自訂圖庫也會一起備份。
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" id="backupClose">關閉</button>
    </div>
  `);

  document.getElementById('backupClose').onclick = closeModal;

  document.getElementById('doExport').onclick = async () => {
    try {
      const backup = {
        _app: '集點寶貝 Reward Stars',
        _version: 2,
        _exportedAt: new Date().toISOString(),
        state,
        customLib,
      };
      const json = JSON.stringify(backup, null, 2);
      const fileName = `集點寶貝備份-${dateStr}.json`;

      // iOS Safari: use Web Share API with file if available
      if (navigator.canShare) {
        const file = new File([json], fileName, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: '集點寶貝備份' });
          return;
        }
      }

      // Standard download (desktop / Android)
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('備份已下載！');
    } catch(e) {
      if (e.name !== 'AbortError') toast('匯出失敗：' + (e.message || e));
    }
  };

  document.getElementById('importFile').onchange = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const backup = JSON.parse(text);
      // Basic validation
      if (!backup.state || !backup.state.kids || !backup.state.themes) {
        toast('檔案格式不對，請選擇集點寶貝備份檔');
        return;
      }
      // Run migration on imported state
      (backup.state.themes || []).forEach(t => {
        if (!Array.isArray(t.stamps)) {
          t.stamps = Array.from({ length: Math.max(0, t.points || 0) }, (_, i) => ({
            id: uid('s'), at: (t.createdAt || Date.now()) + i * 60000,
            sticker: t.sticker || '⭐',
          }));
        }
        t.points = t.stamps.length;
      });
      // Confirm before overwriting
      closeModal();
      setTimeout(() => {
        openConfirm({
          icon: '📥',
          title: '確定要匯入備份？',
          text: `將會覆蓋現有的 ${kids} 位小朋友、${themes} 個主題的資料`,
          confirmLabel: '確定匯入',
          danger: true,
          onConfirm: () => {
            state = backup.state;
            if (backup.customLib) {
              customLib = backup.customLib;
              localStorage.setItem(LIBRARY_KEY, JSON.stringify(customLib));
            }
            saveState();
            closeModal();
            render();
            toast('✅ 匯入成功！');
          }
        });
      }, 150);
    } catch(e) {
      toast('讀取失敗：' + (e.message || '格式錯誤'));
    }
    e.target.value = '';
  };
}

document.getElementById('backupBtn').onclick = openBackupModal;

// ---- Initial library + render ----
loadCustomLib();
loadManifest().then(() => render()); // re-render once manifest is loaded
render(); // initial render with no manifest

// Auto-expire daily check (re-render when a theme's status flips)
setInterval(() => {
  // Just re-render passively; status is computed in render
  if (view.tab === 'cards') render();
}, 60000);

</script>
</body>
</html>
